name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./apps/api[dev]"
      # TODO: Remove these exclusions after enabling model validation from attributes
      # and registering a handler in the confirmation service test.
      - run: >-
          python -m pytest apps/api/tests
          -k "not test_help_request_is_confirmed_then_guest_owned_and_staff_acknowledged
          and not test_confirmation_is_idempotent_but_cannot_be_replayed_with_another_key"
