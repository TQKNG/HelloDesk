[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hellodesk-api"
version = "0.1.0"
description = "Server API for the HelloDesk hotel receptionist demo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "agent-framework-openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
include = ["app/data/*.json"]
